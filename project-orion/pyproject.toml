[tool.poetry]
name = "project-orion"
version = "0.1.0"
description = "Institutional-grade automated Forex trading platform"
authors = ["Project ORION Team"]
readme = "README.md"
packages = [
    { include = "libraries" },
    { include = "shared" },
    { include = "libraries/observability" },
    { include = "apps" },
]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0.1"
sqlalchemy = {version = "^2.0.52", extras = ["asyncio"]}
alembic = "^1.20.0"
redis = "^8.1.0"
asyncpg = "^0.31.0"
aiosqlite = "^0.22.1"
fastapi = "^0.115"
pydantic = "^2.0"
uvicorn = {version = "^0.34", extras = ["standard"]}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-cov = "^4.1.0"
pytest-asyncio = "^1.4"
httpx = "^0.27"
anyio = {version = "^4", extras = ["trio"]}
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.0"
pylint = "^2.17.0"
pip-audit = "^2.10.1"
types-pyyaml = "^6.0.12"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["shared", "libraries"]
skip = [".venv", "node_modules"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["shared", "libraries", "tests"]

# Ensure mypy only treats the intended package roots as importable bases.
# This avoids "Duplicate module named \"main\"" when multiple services each
# contain an entrypoint file named main.py.
explicit_package_bases = true
namespace_packages = true

exclude = ["node_modules", "\\.venv", "services"]


[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pylint.main]
py-version = "3.11"
jobs = 0
ignore-paths = ["^\\.venv/", "^node_modules/"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-ancestors",
    "fixme",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["shared", "libraries"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
