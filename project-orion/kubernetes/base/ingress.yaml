apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orion-ingress
  namespace: orion
  labels:
    app.kubernetes.io/name: orion
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: orion
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Correlation-ID"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.orion.example.com
      secretName: orion-tls
  rules:
    - host: api.orion.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orion-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: orion-api
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: orion-metrics
                port:
                  number: 9090
