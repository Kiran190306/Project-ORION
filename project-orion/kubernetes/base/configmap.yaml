apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-config
  namespace: orion
  labels:
    app.kubernetes.io/name: orion
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: orion
data:
  ORION_SERVICE_NAME: "orion"
  ORION_ENVIRONMENT: "production"
  ORION_LOG_LEVEL: "info"
  ORION_LOG_FORMAT: "json"
  ORION_METRICS_ENABLED: "true"
  ORION_TRACING_ENABLED: "true"
  ORION_TRACING_EXPORTER: "grpc"
  ORION_HEALTH_CHECK_INTERVAL: "30"
  ORION_DB_POOL_SIZE: "20"
  ORION_DB_MAX_OVERFLOW: "40"
  ORION_REDIS_POOL_SIZE: "10"
  ORION_CACHE_TTL_SECONDS: "300"
  ORION_RATE_LIMIT_REQUESTS: "1000"
  ORION_RATE_LIMIT_WINDOW: "60"
