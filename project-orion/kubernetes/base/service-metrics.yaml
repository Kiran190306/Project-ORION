apiVersion: v1
kind: Service
metadata:
  name: orion-metrics
  namespace: orion
  labels:
    app.kubernetes.io/name: orion
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: orion
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
