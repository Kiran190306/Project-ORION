apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: orion-critical
  labels:
    app.kubernetes.io/name: orion
    app.kubernetes.io/component: priority-class
    app.kubernetes.io/part-of: orion
value: 1000
