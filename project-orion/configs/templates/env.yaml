# Environment Configuration Template
# TODO: Configure environment-specific settings

# Application Settings
app:
  name: project-orion
  version: 0.1.0
  environment: ${ENVIRONMENT}

# Database Settings
database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# Kafka Settings
kafka:
  bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS}
  topic_prefix: ${KAFKA_TOPIC_PREFIX}

# Redis Settings
redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}

# API Settings
api:
  host: ${API_HOST}
  port: ${API_PORT}
  timeout: 30

# Monitoring Settings
monitoring:
  enabled: true
  metrics_port: 9090
  trace_enabled: true
