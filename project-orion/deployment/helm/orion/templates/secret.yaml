{{- if not .Values.secrets.external }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orion.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  ORION_DB_PASSWORD: {{ required "ORION_DB_PASSWORD is required" .Values.secrets.dbPassword | quote }}
  ORION_REDIS_PASSWORD: {{ required "ORION_REDIS_PASSWORD is required" .Values.secrets.redisPassword | quote }}
  ORION_API_KEY: {{ required "ORION_API_KEY is required" .Values.secrets.apiKey | quote }}
  ORION_JWT_SECRET: {{ required "ORION_JWT_SECRET is required" .Values.secrets.jwtSecret | quote }}
  ORION_ENCRYPTION_KEY: {{ required "ORION_ENCRYPTION_KEY is required" .Values.secrets.encryptionKey | quote }}
{{- else }}
{{- /* External secrets managed by external-secrets or SealedSecrets */}}
{{- end }}
