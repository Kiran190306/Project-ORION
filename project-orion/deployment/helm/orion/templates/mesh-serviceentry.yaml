{{- if .Values.mesh.enabled }}
{{- if .Values.mesh.mtls.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: {{ include "orion.fullname" . }}-external-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-security
spec:
  hosts:
    - "db.{{ .Values.region.dnsZone }}"
  ports:
    - number: 5432
      name: tcp-postgres
      protocol: TCP
  resolution: DNS
  location: MESH_EXTERNAL
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: {{ include "orion.fullname" . }}-external-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-security
spec:
  hosts:
    - "redis.{{ .Values.region.dnsZone }}"
  ports:
    - number: 6379
      name: tcp-redis
      protocol: TCP
  resolution: DNS
  location: MESH_EXTERNAL
{{- end }}
{{- end }}
