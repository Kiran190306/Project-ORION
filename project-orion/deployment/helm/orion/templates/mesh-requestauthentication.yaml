{{- if and .Values.mesh.enabled .Values.mesh.jwt.enabled }}
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: {{ include "orion.fullname" . }}-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  jwtRules:
    - issuer: {{ .Values.mesh.jwt.issuer | quote }}
      jwksUri: {{ .Values.mesh.jwt.jwksUri | quote }}
      forwardOriginalToken: {{ .Values.mesh.jwt.forwardOriginalToken }}
{{- end }}
