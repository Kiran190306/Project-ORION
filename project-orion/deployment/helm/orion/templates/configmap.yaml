apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orion.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  ORION_SERVICE_NAME: {{ .Values.global.serviceName | quote }}
  ORION_ENVIRONMENT: {{ .Values.global.environment | quote }}
  ORION_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ORION_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  ORION_METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  ORION_TRACING_ENABLED: {{ .Values.config.tracingEnabled | quote }}
  ORION_TRACING_EXPORTER: {{ .Values.config.tracingExporter | quote }}
  ORION_HEALTH_CHECK_INTERVAL: {{ .Values.config.healthCheckInterval | quote }}
  ORION_DB_POOL_SIZE: {{ .Values.config.dbPoolSize | quote }}
  ORION_DB_MAX_OVERFLOW: {{ .Values.config.dbMaxOverflow | quote }}
  ORION_REDIS_POOL_SIZE: {{ .Values.config.redisPoolSize | quote }}
  ORION_CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  ORION_RATE_LIMIT_REQUESTS: {{ .Values.config.rateLimitRequests | quote }}
  ORION_RATE_LIMIT_WINDOW: {{ .Values.config.rateLimitWindow | quote }}
