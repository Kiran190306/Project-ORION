{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.stores }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ include "orion.fullname" $ }}-{{ .name }}
  labels:
    {{- include "orion.labels" $ | nindent 4 }}
spec:
  provider:
    {{- if eq .provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ .region | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "orion.serviceAccountName" $ }}
    {{- else if eq .provider "vault" }}
    vault:
      server: {{ required "vault.server is required" .vault.server }}
      path: {{ .vault.path | default "secret/orion" }}
      version: {{ .vault.version | default "v2" }}
      auth:
        kubernetes:
          mountPath: {{ .vault.mountPath | default "kubernetes" }}
          role: {{ .vault.role | default "orion" }}
          serviceAccountRef:
            name: {{ include "orion.serviceAccountName" $ }}
    {{- end }}
---
{{- end }}
{{- end }}
