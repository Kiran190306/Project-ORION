{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ include "orion.fullname" . }}-secret-store
  labels:
    {{- include "orion.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "orion.serviceAccountName" . }}
    {{- else if eq .Values.externalSecrets.provider "vault" }}
    vault:
      server: {{ .Values.externalSecrets.vaultServer }}
      path: {{ .Values.externalSecrets.vaultPath | default "secret/orion" }}
      version: {{ .Values.externalSecrets.vaultVersion | default "v2" }}
      auth:
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vaultMountPath | default "kubernetes" }}
          role: {{ .Values.externalSecrets.vaultRole | default "orion" }}
          serviceAccountRef:
            name: {{ include "orion.serviceAccountName" . }}
    {{- end }}
{{- end }}
