{{- if .Values.mesh.enabled }}
{{- $tm := .Values.mesh.trafficManagement }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "orion.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-traffic
spec:
  host: {{ include "orion.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: {{ $tm.loadBalancer.simple | default "ROUND_ROBIN" }}
    connectionPool:
      tcp:
        maxConnections: {{ $tm.circuitBreakers.maxConnections | default 100 }}
      http:
        http1MaxPendingRequests: {{ $tm.circuitBreakers.maxPendingRequests | default 10 }}
        maxRequestsPerConnection: {{ $tm.circuitBreakers.maxRequestsPerConnection | default 10 }}
        maxRetries: {{ $tm.circuitBreakers.maxRetries | default 3 }}
    outlierDetection:
      consecutive5xxErrors: {{ $tm.outlierDetection.consecutiveErrors | default 5 }}
      interval: {{ $tm.outlierDetection.interval | default "30s" }}
      baseEjectionTime: {{ $tm.outlierDetection.baseEjectionTime | default "30s" }}
      maxEjectionPercent: {{ $tm.outlierDetection.maxEjectionPercent | default 10 }}
    tls:
      mode: {{ if .Values.mesh.security.mtls.mode }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "orion.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-traffic
spec:
  host: {{ include "orion.fullname" . }}-worker.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: {{ $tm.loadBalancer.simple | default "ROUND_ROBIN" }}
    connectionPool:
      tcp:
        maxConnections: {{ $tm.circuitBreakers.maxConnections | default 100 }}
      http:
        http1MaxPendingRequests: {{ $tm.circuitBreakers.maxPendingRequests | default 10 }}
        maxRequestsPerConnection: {{ $tm.circuitBreakers.maxRequestsPerConnection | default 10 }}
    outlierDetection:
      consecutive5xxErrors: {{ $tm.outlierDetection.consecutiveErrors | default 5 }}
      interval: {{ $tm.outlierDetection.interval | default "30s" }}
      baseEjectionTime: {{ $tm.outlierDetection.baseEjectionTime | default "30s" }}
      maxEjectionPercent: {{ $tm.outlierDetection.maxEjectionPercent | default 10 }}
    tls:
      mode: {{ if .Values.mesh.security.mtls.mode }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
{{- end }}
