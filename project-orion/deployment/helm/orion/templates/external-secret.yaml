{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.secrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "orion.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "orion.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "storeRef.name is required" .storeRef.name }}
    kind: {{ .storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .target.name | default (printf "%s-%s" (include "orion.fullname" $) .name) }}
    creationPolicy: {{ .target.creationPolicy | default "Owner" }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "remoteRef.key is required" .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
