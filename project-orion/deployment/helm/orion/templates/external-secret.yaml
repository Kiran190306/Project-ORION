{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.secrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "orion.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "orion.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "orion.fullname" $ }}-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .targetSecretName | default (printf "%s-%s" (include "orion.fullname" $) .name) }}
    creationPolicy: Owner
  data:
    {{- range .remoteKeys }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteRef }}
        property: {{ .property | default "" }}
    {{- end }}
---
{{- end }}
{{- end }}
