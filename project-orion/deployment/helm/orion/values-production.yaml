# ════════════════════════════════════════════════════════════
# ORION Production Overrides
# ════════════════════════════════════════════════════════════

global:
  environment: "production"

api:
  replicas: 3
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2

worker:
  enabled: true
  replicas: 3
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10

scheduler:
  enabled: true
  replicas: 1

ingress:
  enabled: true
  host: "api.orion.example.com"

config:
  logLevel: "info"

networkPolicy:
  enabled: true

resourceQuota:
  enabled: true

limitRange:
  enabled: true

priorityClasses:
  enabled: true
