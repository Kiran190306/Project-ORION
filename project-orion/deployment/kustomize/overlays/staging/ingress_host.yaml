apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orion-ingress
spec:
  rules:
    - host: api-staging.orion.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orion-api
                port:
                  number: 80
