apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orion-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.orion.example.com"
        - "api-us-west-2.orion.example.com"
      secretName: orion-tls-us-west-2
  rules:
    - host: api-us-west-2.orion.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orion-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: orion-api
                port:
                  number: 80
