version: "1"

databases:
  - name: orion-postgres
    databaseName: orion_prod
    user: orion
    plan: free
    ipAllowList: []

services:
  - type: redis
    name: orion-redis
    plan: free
    ipAllowList: [] # Internal private network only

  # ─── Trading Engine ASGI API ───────────────────────────────────────────────
  - type: web
    name: orion-api
    rootDir: project-orion
    env: docker
    dockerfilePath: docker/apps/trading-engine/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ORION_ENVIRONMENT
        value: production
      - key: ORION_LOG_LEVEL
        value: INFO
      - key: ORION_DATABASE_URL
        fromDatabase:
          name: orion-postgres
          property: connectionString
      - key: ORION_REDIS_URL
        fromService:
          type: redis
          name: orion-redis
          property: connectionString
      - key: ORION_RUN_MIGRATIONS
        value: "true"
      - key: ORION_JWT_SECRET_KEY
        generateValue: true
      - key: ORION_CORS_ORIGINS
        value: https://orion-dashboard.onrender.com
      - key: ORION_WORKER_ENABLED
        value: "false"

  # ─── Production Trading Dashboard (SPA) ────────────────────────────────────
  - type: web
    name: orion-dashboard
    rootDir: project-orion
    env: docker
    dockerfilePath: apps/dashboard/Dockerfile
    dockerContext: apps/dashboard
    plan: free
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://orion-api.onrender.com

